baseURL = "https://aleph-beth.github.io/AI-Watchtower/"
title = "AI Watchtower"
theme = "PaperMod"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = true
  minifyOutput = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  description = "AI security research — prompt injection, MCP vulnerabilities, agent threat models, hardening playbooks."
  author = "aleph-beth"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowToc = true
  TocOpen = false
  comments = false
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false

  [params.label]
    text = "AlephBeth"

  [params.assets]
    disableHLJS = true
    disableFingerprinting = false
    favicon = "favicon.svg"
    favicon16x16 = "favicon.svg"
    favicon32x32 = "favicon.svg"
    apple_touch_icon = "favicon.svg"
    safari_pinned_tab = "favicon.svg"
    theme_color = "#15264d"
    msapplication_TileColor = "#15264d"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/aleph-beth/AI-Watchtower"

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 4
    ordered = false
    startLevel = 2

# ─── Multilingual ────────────────────────────────────────────────────────────

[languages]

  [languages.fr]
    languageName = "Français"
    languageCode = "fr-FR"
    contentDir = "content/fr"
    weight = 2
    title = "AI Watchtower"
    [languages.fr.params]
      description = "Veille critique sur la sécurité des systèmes d'IA — injection de prompts, failles MCP, modèles de menace agentiques, playbooks de durcissement."
      [languages.fr.params.homeInfoParams]
        Title = "AI Watchtower"
        Content = """
**AI Watchtower** est une veille critique sur la sécurité des systèmes d'IA. Chaque entrée part d'un morceau de recherche en cours — injection de prompts directe et indirecte, failles dans les serveurs MCP, modèles de menace pour les agents, arbitrages concrets de durcissement — et le traduit en consignes actionnables pour les concepteurs et opérateurs d'assistants LLM.

Le format est court, structuré, opérationnel : une analyse, une grille de risque, une checklist applicable le jour même.

Articles ci-dessous.
"""
    [[languages.fr.menu.main]]
      identifier = "posts"
      name = "Articles"
      url = "posts/"
      weight = 10
    [[languages.fr.menu.main]]
      identifier = "tags"
      name = "Tags"
      url = "tags/"
      weight = 20
    [[languages.fr.menu.main]]
      identifier = "search"
      name = "Recherche"
      url = "search/"
      weight = 30
    [[languages.fr.menu.main]]
      identifier = "contact"
      name = "Contact"
      url = "contact/"
      weight = 40

  [languages.en]
    languageName = "English"
    languageCode = "en-US"
    contentDir = "content/en"
    weight = 1
    title = "AI Watchtower"
    [languages.en.params]
      description = "Critical watch on AI security — prompt injection, MCP vulnerabilities, agent threat models, hardening playbooks."
      [languages.en.params.homeInfoParams]
        Title = "AI Watchtower"
        Content = """
**AI Watchtower** is a critical-watch project on the security of AI systems. Each entry takes a piece of ongoing research — direct and indirect prompt injection, MCP server vulnerabilities, agent threat models, concrete hardening tradeoffs — and turns it into actionable guidance for builders and operators of LLM-based assistants.

The format is short, structured, operational: one analysis, one risk grid, one checklist you can apply the same day.

Articles below.
"""
    [[languages.en.menu.main]]
      identifier = "posts"
      name = "Posts"
      url = "posts/"
      weight = 10
    [[languages.en.menu.main]]
      identifier = "tags"
      name = "Tags"
      url = "tags/"
      weight = 20
    [[languages.en.menu.main]]
      identifier = "search"
      name = "Search"
      url = "search/"
      weight = 30
    [[languages.en.menu.main]]
      identifier = "contact"
      name = "Contact"
      url = "contact/"
      weight = 40

